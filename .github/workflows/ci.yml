name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies (minimal for CI)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir -r requirements/ci.txt

      - name: Syntax check core modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            api/main.py \
            api/dependencies.py \
            api/schemas/__init__.py \
            api/services/command_service.py \
            api/services/text_formatting.py \
            api/routers/chat.py \
            api/routers/context.py \
            api/routers/memory.py \
            api/routers/runtime.py \
            api/routers/system.py \
            api/routers/training.py \
            brain/response_parser.py \
            brain/ollama_brain.py \
            brain/vllm_brain.py \
            brain/steering_backend.py \
            brain/steering_api_server.py \
            brain/steering_manager.py \
            brain/agents/steering_manager.py \
            config/config.py \
            config/prompts.py \
            forschung/report/build_report.py \
            memory/chat_manager.py \
            memory/emotions_engine.py \
            memory/forgetting_curve.py \
            memory/memory_engine.py \
            memory/sleep_phase.py \
            memory/short_term_memory.py \
            memory/function_registry.py \
            web_infrastructure/backend_wrapper.py \
            web_infrastructure/chappie_runtime.py \
            web_infrastructure/contracts.py \
            web_infrastructure/formatting.py \
            web_infrastructure/generation.py \
            web_infrastructure/persistence.py \
            web_infrastructure/turn_context.py \
            web_infrastructure/turn_pipeline.py \
            web_infrastructure/ui_utils.py \
            chappie_brain_cli.py

      - name: Run quick tests
        shell: bash
        run: |
          set -eo pipefail
          python tests/test_forgetting_curve.py
          python tests/test_memory_associations.py
          python tests/test_emotion_transition_rules.py
          python tests/test_vector_only_emotion_path.py
          python tests/test_quick.py
          python tests/test_life_simulation.py
          python tests/test_debug_monitor_data.py
          python tests/test_local_first_runtime.py
          python tests/test_config_package_import.py
          python tests/test_chat_ui_formatting.py
          python tests/test_reasoning_layering.py
          python tests/test_web_ui_consistency.py
          python tests/test_root_config.py
          python tests/test_settings_integrity.py
          python tests/test_cli_import.py
          python tests/test_cli_display.py
          python tests/test_cli_commands.py
          python tests/test_cli_remote.py
          python tests/test_forschung_harness.py
          python tests/test_runtime_architecture.py
          python forschung/report/validate_report_v5_freeze.py
          python forschung/report/validate_report_v6.py
          python scripts/validate_skill_sync.py

      - name: Run deterministic extended tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_vllm_response_handling.py
          python tests/test_ollama_response_handling.py
          python tests/test_chat_manager_persistence.py
          python tests/test_short_term_memory.py
          python tests/test_training_config_ui.py
          python tests/test_training_daemon_lifecycle.py
          python tests/test_api_contract.py
          python tests/test_forschung_report.py
          python tests/test_report_v6.py
          python tests/test_skill_sync.py

      - name: Lint active architecture boundaries
        shell: bash
        run: |
          ruff check --config config/ruff.toml \
            api/dependencies.py \
            api/main.py \
            api/routers/chat.py \
            api/routers/runtime.py \
            api/services/command_service.py \
            brain/steering_manager.py \
            brain/steering_backend.py \
            brain/brain_pipeline.py \
            memory/chat_manager.py \
            memory/emotions_engine.py \
            memory/forgetting_curve.py \
            memory/memory_engine.py \
            memory/sleep_phase.py \
            web_infrastructure \
            tests/test_chat_manager_persistence.py \
            tests/test_runtime_architecture.py \
            tests/test_memory_associations.py \
            tests/test_emotion_transition_rules.py \
            tests/test_vector_only_emotion_path.py \
            tests/test_report_v6.py \
            tests/test_skill_sync.py \
            forschung/report/build_report.py \
            forschung/report/inspect_prompt_contract.py \
            forschung/report/validate_report_v5_freeze.py \
            forschung/report/validate_report_v6.py \
            scripts/validate_skill_sync.py

      - name: Type-check public contracts
        shell: bash
        run: |
          mypy --config-file config/mypy.ini \
            web_infrastructure/contracts.py \
            web_infrastructure/turn_context.py \
            web_infrastructure/backend_wrapper.py \
            api/schemas/__init__.py

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm run build
